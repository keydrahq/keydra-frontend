# Included at the http level, which is where a map has to live — nginx refuses one inside a
# server block, and that is the error a first attempt at this always produces.
#
# A WebSocket upgrade is a hop-by-hop header: the Connection header a proxy sends is its own
# rather than the client's. This says "Connection: upgrade" when the client asked to upgrade
# and "Connection: close" otherwise, which is what lets one location serve both the REST
# requests and the notification socket that shares its path.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
