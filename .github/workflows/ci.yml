name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two setup-node calls, and corepack between them, which is the documented way round a
      # real ordering problem rather than belt and braces. `cache: yarn` makes the action run
      # `yarn cache dir` to find what to cache, and the yarn on a fresh runner is 1.22 — which
      # refuses to run at all for a project whose packageManager field says 4.x, so the step
      # fails before anything is installed. Enabling corepack first needs a Node to enable it
      # against, and enabling it before any setup-node leaves its shims pointing at the Node
      # setup-node is about to replace. Hence: install Node, enable corepack, ask for the cache.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      # --immutable: a lockfile the install would have changed fails here rather than
      # quietly resolving to something nobody has run.
      - name: Install
        run: yarn install --immutable

      # prettier --check, eslint and tsc -b, in one script. All three, because a type error
      # that only shows up in a production build is one nobody sees until the build.
      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test:ci

      # The interface ships as static files built into the backend's image, so a build that
      # only works in dev mode is a build that works nowhere it matters.
      - name: Build
        run: yarn build
